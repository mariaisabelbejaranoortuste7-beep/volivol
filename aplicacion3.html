<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLLEYAPP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a2a4a, #2c3e6b);
            color: white;
        }

        /* === 1️⃣ LOGO === */
        .logo-section {
            background: linear-gradient(90deg, #00b4db, #0083b0);
            padding: 30px 20px;
            text-align: center;
        }
        .logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .logo span {
            color: #ffd700;
        }

        /* === 2️⃣ BIENVENIDA / FORMULARIO === */
        .welcome-section {
            padding: 40px 25px;
            max-width: 520px;
            margin: 0 auto;
        }
        .welcome-section h1 {
            text-align: center;
            font-size: 30px;
            color: #00d9ff;
            margin-bottom: 8px;
        }
        .welcome-desc {
            text-align: center;
            color: #b0c4de;
            margin-bottom: 35px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #d0e4ff;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 15px;
        }
        .form-group input::placeholder {
            color: #9fb6d0;
        }
        .btn-enter {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(90deg, #00d9ff, #00b4db);
            color: #002b44;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .note {
            margin-top: 18px;
            font-size: 12px;
            color: #8fb3d9;
            text-align: center;
        }

        /* === 3️⃣ PANTALLA PRINCIPAL === */
        .main-section {
            padding: 40px 25px;
            max-width: 700px;
            margin: 0 auto;
        }
        .greeting-card {
            background: rgba(0,0,0,0.25);
            border-left: 3px solid #ff4466;
            padding: 18px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        .greeting-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .greeting-info {
            color: #b0c4de;
            font-size: 14px;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }
        .main-btn {
            padding: 18px 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .main-btn:hover {
            background: rgba(0,217,255,0.15);
        }
        .icon {
            font-size: 20px;
        }
        .info-bar {
            background: rgba(255,204,0,0.15);
            border-left: 3px solid #ffcc00;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            color: #ffe680;
            margin: 20px 0;
        }
        .start-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #ffcc00;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item {
            text-align: center;
            color: #9fb6d0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- ======================================
         1️⃣ LOGO - ARRIBA PRIMERO
    ====================================== -->
    <div class="logo-section">
        <div class="logo">voleibol<span>APP</span></div>
    </div>

    <!-- ======================================
         2️⃣ FORMULARIO DE BIENVENIDA
    ====================================== -->
    <div class="welcome-section">
        <h1>Bienvenido a voleibol</h1>
        <p class="welcome-desc">Tu espacio para aprender técnicas y estrategias de voleibol de manera práctica e interactiva</p>

        <div class="form-group">
            <label>Tu nombre o apodo (opcional)</label>
            <input type="text" placeholder="María Isabel Bejarano Ortúz">
        </div>

        <div class="form-group">
            <label>Edad</label>
            <input type="number" placeholder="18">
        </div>

        <div class="form-group">
            <label>Posición favorita</label>
            <select>
                <option>No tengo una posición definida</option>
                <option>Armadora</option>
                <option>Punta</option>
                <option>Central</option>
                <option>Opuesta</option>
                <option>Líbero</option>
            </select>
        </div>

        <button class="btn-enter">Entrar</button>
        <p class="note">Tus datos se guardan solamente en este navegador para personalizar la aplicación.</p>
    </div>

    
        <div class="buttons-grid">
            <button class="main-btn">
                <span class="icon">🏐</span> Técnicas
            </button>
            <button class="main-btn">
                <span class="icon">⭐</span> Ejercicios
            </button>
            <button class="main-btn">
                <span class="icon">📋</span> Sistemas de juego
            </button>
            <button class="main-btn">
                <span class="icon">💡</span> Guía
            </button>
            <button class="main-btn">
                <span class="icon">📅</span> Entrenar hoy
            </button>
            <button class="main-btn">
                <span class="icon">🌟</span> Favoritos
            </button>
        </div>

        
        <button class="start-btn">Comenzar ahora</button>

        <div class="nav-bar">
            <div class="nav-item">🏠 Inicio</div>
            <div class="nav-item">📊 Progreso</div>
            <div class="nav-item">⚙️ Ajustes</div>
        </div>
    </div>

</body>
</html>
