<title>Mi Página Web</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* FONDO */
body{
    background: #cfcfcf;
    font-family: cursive;
}

/* ENCABEZADO */
header{
    width:100%;
    background:#555;
    padding:25px 0;
    text-align:center;
}

/* TITULO */
header h1{
    color:#d7c8ff;
    font-size:42px;
    margin-bottom:20px;
}

/* MENU */
nav a{
    text-decoration:none;
    color:#00ffff;
    margin:0 25px;
    font-size:20px;
    font-weight:bold;
}

nav a:hover{
    text-decoration:underline;
}

/* CONTENIDO */
.contenido{
    width:100%;
    height:500px;
    background:#d9d9d9;
    padding:40px 30px;
}

/* TEXTO */
.contenido p{
    color:white;
    font-size:28px;
    margin-bottom:35px;
}

/* IMAGEN REDONDA */
.foto{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid white;
}

</style>

</head>
