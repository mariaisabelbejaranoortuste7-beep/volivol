<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>EDU-VOLEY</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #06152b, #1a365d);
    color: white;
    min-height: 100vh;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    background: #1e262c;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

.header {
    background: linear-gradient(90deg, #4ecdc4, #44b7ad);
    padding: 18px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #06152b;
    letter-spacing: 2px;
}

.page {
    display: none;
    padding: 25px;
}

.page.active {
    display: block;
}

/* REGISTRO */

.welcome-title {
    font-size: 25px;
    margin-bottom: 10px;
}

.subtitle {
    color: #9ca3af;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #d1d5db;
}

.form-control {
    width: 100%;
    padding: 12px;
    background: #26343c;
    border: 1px solid #52616b;
    border-radius: 8px;
    color: white;
    font-size: 16px;
}

.form-control:focus {
    outline: none;
    border-color: #10b981;
}

select.form-control option {
    background: #1e262c;
    color: white;
}

.btn-primary {
    width: 100%;
    padding: 13px;
    background: #10b981;
    border: none;
    border-radius: 8px;
    color: #06152b;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    margin-top: 10px;
}

.btn-primary:hover {
    background: #059669;
}

.disclaimer {
    font-size: 12px;
    color: #9ca3af;
    text-align: center;
    margin-top: 15px;
}

/* MENU PRINCIPAL */

.menu-title {
    text-align: center;
    margin-bottom: 25px;
    font-size: 23px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: linear-gradient(145deg, #1e4a7a, #163a66);
    padding: 25px 12px;
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    color: white;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #ffd700;
}

.card-icon {
    font-size: 40px;
    margin-bottom: 12px;
}

.card-title {
    font-size: 17px;
    font-weight: bold;
}

.btn-perfil {
    width: 100%;
    background: #ffc107;
    color: #06152b;
    padding: 13px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* INFORMACIÓN DE CADA SECCIÓN */

.contenido {
    background: #163a66;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    border: 2px solid #4ecdc4;
}

.imagen-tema {
    font-size: 65px;
    margin-bottom: 15px;
}

.contenido h2 {
    color: #ffd700;
    margin-bottom: 20px;
    font-size: 23px;
}

.contenido p {
    font-size: 16px;
    line-height: 1.9;
    color: #ffffff;

    padding: 15px;
    border-radius: 10px;

.btn-volver {

    background: #ffc107;
    color: #06152b;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

@media(max-width: 350px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

/* CAMBIAR PANTALLAS */

function cambiarPantalla(id) {

    document.querySelectorAll(".page").forEach(function(pagina) {
        pagina.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

/* EMPEZAR DESPUÉS DEL REGISTRO */

function empezar() {

    const edad = document.getElementById("edad").value;

    if (edad === "" || Number(edad) < 1) {
        alert("Por favor, introduce una edad válida.");
        return;
    }

    const nombre = document.getElementById("nombre").value;

    if (nombre.trim() !== "") {
        document.querySelector(".menu-title").textContent =
        "¡Bienvenido/a " + nombre + "! 🏐";
    }

    cambiarPantalla("menu");
}
