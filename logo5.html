<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDU-VOLEY</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #06152b;
            color: white;
        }

        /* Pantalla de bienvenida */
        .inicio {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;

            background:
                linear-gradient(
                    rgba(3, 12, 35, 0.45),
                    rgba(3, 12, 35, 0.80)
                );
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Contenedor del logo SVG */
        .logo-container {
            width: 100%;
            max-width: 320px;
            margin-bottom: 25px;
        }

        .logo-container svg {
            width: 100%;
            height: auto;
        }

        /* Texto de bienvenida */
        h1 {
            font-size: 30px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 16px;
            color: #d9e8ff;
            margin-bottom: 35px;
        }

        /* Botón ingresar */
        .boton {
            display: inline-block;
            width: 100%;
            max-width: 320px;
            padding: 17px;
            border-radius: 40px;
            background: linear-gradient(
                90deg, #00c878, #00a8d8
            );
            color: white;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
            border: 2px solid #62e9ff;
            cursor: pointer;
            transition: 0.3s;
        }

        .boton:hover {
            transform: scale(1.04);
            box-shadow: 0 0 20px #00c878;
        }

        .pie {
            margin-top: 25px;
            font-size: 13px;
            color: #b8cce8;
        }
    </style>
</head>

<body>

    <section class="inicio">

        <!-- Logo dibujado directamente en HTML/SVG -->
        <div class="logo-container">
            <svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
                <!-- Marco Hexagonal -->
                <polygon points="250,30 420,100 420,280 250,350 80,280 80,100" fill="none" stroke="#25396e" stroke-width="8" rx="20"/>
                
                <!-- Estela de movimiento del balón -->
                <path d="M 180,110 Q 320,60 400,20" stroke="#00c878" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M 210,130 Q 340,90 420,50" stroke="#00d2b4" stroke-width="10" fill="none" stroke-linecap="round"/>
                <path d="M 230,160 Q 360,120 430,90" stroke="#00c878" stroke-width="8" fill="none" stroke-linecap="round"/>

                <!-- Balón de Voleibol -->
                <circle cx="250" cy="180" r="75" fill="#06152b" stroke="#00d2b4" stroke-width="8"/>
                <!-- Líneas del balón -->
                <path d="M 250,105 A 75,75 0 0,1 250,255" fill="none" stroke="#00d2b4" stroke-width="6"/>
                <path d="M 175,180 A 75,75 0 0,1 325,180" fill="none" stroke="#00d2b4" stroke-width="6"/>
                <path d="M 197,127 Q 250,180 303,233" fill="none" stroke="#00d2b4" stroke-width="5"/>
                <path d="M 197,233 Q 250,180 303,127" fill="none" stroke="#00d2b4" stroke-width="5"/>

                <!-- Texto EDU-VOLEY -->
                <text x="250" y="305" font-family="'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#00d2b4" text-anchor="middle">EDU-VOLEY</text>
                
                <!-- Texto BALL APP -->
                <text x="250" y="335" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#3b5998" letter-spacing="4" text-anchor="middle">BALL APP</text>
            </svg>
        </div>

        <!-- Bienvenida -->
        <h1>¡Bienvenido a EDU-VOLEY!</h1>

        <p>
            Aprende, practica y mejora tus habilidades
            en el voleibol.
        </p>

        <!-- Botón de ingreso -->
        <a href="file:///D:/isabel/practica%201/aplicacion5.html" class="boton">
            Ingresar →
        </a>

        <div class="pie">
            Tu progreso comienza aquí 🏐
        </div>

    </section>

</body>
</html>
