<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-VOLEY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #12181b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e262c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* Encabezado */
        .header {
            background-color: #10b981;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #12181b;
        }

        /* Secciones */
        .page {
            padding: 25px;
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Formulario de Bienvenida */
        .welcome-title {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #10b981;
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            border: none;
            border-radius: 8px;
            color: #12181b;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #059669;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            margin-top: 15px;
        }

        /* Grid de Menú Principal */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            background-color: rgba(255, 255, 255, 0.08);
        }

        .card-icon {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .warning-text {
            font-size: 0.75rem;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 15px;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background-color: #eab308;
            border: none;
            border-radius: 8px;
            color: #12181b;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Navegación Inferior */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: #161d22;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: #10b981;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">EDU-VOLEY</div>

        <!-- PÁGINA 1: INICIO DE SESIÓN / BIENVENIDA -->
        <div id="welcome-page" class="page active">
            <h2 class="welcome-title">Bienvenido a EDU-VOLEY</h2>
            <p class="subtitle">Tu nombre o apodo (opcional, puedes omitirlo):</p>

            <div class="form-group">
                <input type="text" class="form-control" placeholder="Nombre o apodo">
            </div>

            <div class="form-group">
                <label>Edad:</label>
                <input type="number" class="form-control" value="18" placeholder="Edad">
            </div>

            <div class="form-group">
                <label>Posición favorita:</label>
                <select class="form-control">
                    <option>No tengo una posición definida</option>
                    <option>Colocador / Armador</option>
                    <option>Rematador / Opuesto</option>
                    <option>Auxiliar / Punta</option>
                    <option>Central</option>
                    <option>Líbero</option>
                </select>
           <div id="voley-page" class="page">
    <!-- Aquí va todo el menú de voleibol:
         Técnicas, Ejercicios, Sistemas, Quiz,
         Entrenar hoy y Favoritos. -->
</div>

            <button class="btn-primary" onclick="showDashboard()">Empezar</button>

            <p class="disclaimer">No pedimos datos personales vinculantes. Todo se guarda solo en tu teléfono.</p>
        </div>

        <!-- PÁGINA 2: PANEL PRINCIPAL -->
        

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-VOLEY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #06152b 0%, #1a365d 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            background: linear-gradient(90deg, #4ecdc4, #44b7ad);
            text-align: center;
            padding: 18px;
            font-size: 26px;
            font-weight: bold;
            color: #06152b;
            border-radius: 12px;
            margin-bottom: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: linear-gradient(145deg, #1e4a7a, #163a66);
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            color: white;
        }
        .card:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: #ffd700;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.2);
        }
        .card-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #f0f0f0;
        }
        /* Página emergente */
        .pagina {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 21, 43, 0.95);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .contenido-pagina {
            background: linear-gradient(145deg, #1a365d, #0f2744);
            padding: 35px;
            border-radius: 20px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 2px solid #4ecdc4;
        }
        .imagen-tema {
            font-size: 70px;
            margin-bottom: 15px;
        }
        .contenido-pagina h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 26px;
        }
        .contenido-pagina p {
            font-size: 17px;
            line-height: 1.8;
            color: #e8e8e8;
            background: rgba(78, 205, 196, 0.1);
            padding: 15px;
            border-radius: 10px;
        }
        .btn-volver {
            margin-top: 25px;
            background: linear-gradient(90deg, #ffc107, #e0ab00);
            color: #06152b;
            border: none;
            padding: 12px 35px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-volver:hover {
            transform: scale(1.05);
        }
        .btn-perfil {
            display: block;
            max-width: 700px;
            background: linear-gradient(90deg, #ffc107, #e0ab00);
            color: #06152b;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            margin: 30px auto 0;
            border: none;
            font-size: 17px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-perfil:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="header">🏐 EDU-VOLEY 🏐</div>

    <div class="grid">
        <button class="card" onclick="mostrarPagina('tecnicas')">
            <div class="card-icon">🏐</div>
            <div class="card-title">Técnicas</div>
        </button>

        <button class="card" onclick="mostrarPagina('ejercicios')">
            <div class="card-icon">💪</div>
            <div class="card-title">Ejercicios</div>
        </button>

        <button class="card" onclick="mostrarPagina('sistemas')">
            <div class="card-icon">📐</div>
            <div class="card-title">Sistemas de juego</div>
        </button>

        <button class="card" onclick="mostrarPagina('quiz')">
            <div class="card-icon">🧠</div>
            <div class="card-title">Quiz</div>
        </button>

        <button class="card" onclick="mostrarPagina('entrenar')">
            <div class="card-icon">🏃</div>
            <div class="card-title">Entrenar hoy</div>
        </button>

        <button class="card" onclick="mostrarPagina('favoritos')">
            <div class="card-icon">⭐</div>
            <div class="card-title">Favoritos</div>
        </button>
    </div>

    <button class="btn-perfil">👤 Cambiar perfil</button>

    <!-- Página emergente -->
    <div id="pagina" class="pagina">
        <div class="contenido-pagina">
            <div id="pagina-imagen" class="imagen-tema"></div>
            <h2 id="pagina-titulo"></h2>
            <p id="pagina-texto"></p>
            <button class="btn-volver" onclick="cerrarPagina()">← Volver al menú</button>
        </div>
    </div>

    <script>
        const datos = {
            tecnicas: {
                imagen: '🏐🤾',
                titulo: 'TÉCNICAS DEL VOLEIBOL',
                texto: '✅ <strong>Saque:</strong> poner el balón en juego\n✅ <strong>Recepción:</strong> recibir el saque\n✅ <strong>Pase:</strong> colocar el balón al atacante\n✅ <strong>Remate:</strong> golpear fuerte al oponente\n✅ <strong>Bloqueo:</strong> defender en la red'
            },
            ejercicios: {
                imagen: '🏋️‍♂️🤸‍♀️',
                titulo: 'EJERCICIOS',
                texto: '🔥 <strong>Calentamiento:</strong> mover cuerpo 10 min\n🔥 <strong>Control de balón:</strong> pases contra pared\n🔥 <strong>Práctica de saque:</strong> 15 repeticiones\n🔥 <strong>Remate:</strong> saltos y golpes\n🔥 <strong>Estiramiento:</strong> relajar músculos al final'
            },
            sistemas: {
                imagen: '👥📊',
                titulo: 'SISTEMAS DE JUEGO',
                texto: '📌 <strong>4-2:</strong> 4 atacantes + 2 colocadores (principiantes)\n📌 <strong>5-1:</strong> 5 atacantes + 1 colocador (más usado)\n📌 <strong>6-2:</strong> 6 atacantes + 2 colocadores (ataque fuerte)\n\nSe refiere a cómo se organizan los 6 jugadores en la cancha.'
            },
            quiz: {
                imagen: '❓🏆',
                titulo: 'QUIZ - PREGUNTAS',
                texto: '🧠 Pon a prueba lo que aprendiste:\n• ¿Cuántos jugadores juegan por equipo? → 6\n• ¿Qué es el saque? → iniciar el juego\n• ¿Dónde se coloca el colocador? → Zona 2/3\n• ¿Cuándo hay punto? → balón cae al suelo contrario'
            },
            entrenar: {
                imagen: '⏱️📅',
                titulo: 'ENTRENAR HOY',
                texto: '⏱️ <strong>Rutina recomendada:</strong>\n\n00:00 - 05:00 → Calentamiento\n05:00 - 15:00 → Pases y recepción\n15:00 - 25:00 → Saques y remates\n25:00 - 30:00 → Estiramiento\n\n¡La constancia hace al jugador! 💪'
            },
            favoritos: {
                imagen: '❤️⭐',
                titulo: 'TUS FAVORITOS',
                texto: '⭐ Aquí puedes guardar:\n• Los ejercicios que más te gustaron\n• Las reglas importantes\n• Tus metas de entrenamiento\n• Lo que quieres repasar después\n\n¡Marca lo más importante para ti!'
            }
        };

        function mostrarPagina(opcion) {
            const pagina = document.getElementById('pagina');
            document.getElementById('pagina-imagen').textContent = datos[opcion].imagen;
            document.getElementById('pagina-titulo').textContent = datos[opcion].titulo;
            document.getElementById('pagina-texto').innerHTML = datos[opcion].texto;
            pagina.style.display = 'flex';
        }

        function cerrarPagina() {
            document.getElementById('pagina').style.display = 'none';
        }
    </script>

</body>
</html>
